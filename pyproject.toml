[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agy-multiprofile"
version = "0.1.0"
description = "Seamless, safety-first CLI & TUI profile and account switcher for Google Antigravity / Gemini CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Team" }
]
keywords = [
    "antigravity",
    "gemini",
    "cli",
    "tui",
    "profiles",
    "mcp",
    "hooks",
    "account-switcher"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities"
]

dependencies = [
    "textual>=8.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
agy-profile = "agy_multiprofile.cli:main"
agy-multiprofile = "agy_multiprofile.cli:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
